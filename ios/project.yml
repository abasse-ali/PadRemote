name: PadRemote
options:
  bundleIdPrefix: fr.padremote
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  PadRemote:
    type: application
    platform: iOS
    sources:
      - path: PadRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.padremote.remote
        PRODUCT_NAME: PadRemote
        INFOPLIST_FILE: PadRemote/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    scheme: {}
